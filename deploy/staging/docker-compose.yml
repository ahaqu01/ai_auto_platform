name: ai-auto-platform-staging

x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  postgres:
    image: postgres:16.4-alpine
    env_file: ${STAGING_DATABASE_ENV_FILE:?set STAGING_DATABASE_ENV_FILE}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
      - ../postgres/01-runtime-role.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [staging-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    env_file: ${STAGING_STORAGE_ENV_FILE:?set STAGING_STORAGE_ENV_FILE}
    volumes: [staging-minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth", "--health-enabled=true"]
    env_file: ${STAGING_IDENTITY_ENV_FILE:?set STAGING_IDENTITY_ENV_FILE}
    environment:
      KC_HOSTNAME: http://127.0.0.1:${STAGING_HTTP_PORT:-8081}/auth
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/ai-platform-staging-realm.json:/opt/keycloak/data/import/ai-platform-staging-realm.json:ro
      - staging-keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  migrate:
    build: {context: ../.., dockerfile: deploy/demo/api.Dockerfile}
    env_file: ${STAGING_MIGRATION_ENV_FILE:?set STAGING_MIGRATION_ENV_FILE}
    volumes:
      - ../postgres/02-service-roles.sql:/run/service-roles.sql:ro
    command: ["python", "-c", "import os,pathlib,psycopg; from sqlalchemy.engine import make_url; from alembic import command; from alembic.config import Config; c=Config('/app/apps/api/alembic.ini'); c.set_main_option('script_location','/app/apps/api/migrations'); c.set_main_option('prepend_sys_path','/app/apps/api/src'); c.set_main_option('sqlalchemy.url',os.environ['DATABASE_URL']); command.upgrade(c,'head'); db=psycopg.connect(make_url(os.environ['DATABASE_URL']).set(drivername='postgresql').render_as_string(hide_password=False)); db.execute(pathlib.Path('/run/service-roles.sql').read_text()); db.commit(); db.close()"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    logging: *default-logging

  api:
    build: {context: ../.., dockerfile: deploy/demo/api.Dockerfile}
    env_file: ${STAGING_API_ENV_FILE:?set STAGING_API_ENV_FILE}
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    restart: unless-stopped
    logging: *default-logging

  artifact-maintenance:
    build: {context: ../.., dockerfile: deploy/demo/api.Dockerfile}
    env_file: ${STAGING_MAINTENANCE_ENV_FILE:?set STAGING_MAINTENANCE_ENV_FILE}
    command: ["python", "-m", "platform_api.modules.artifact.maintenance_runner"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,pathlib; p=pathlib.Path(os.environ.get('ARTIFACT_MAINTENANCE_HEARTBEAT_PATH','/tmp/artifact-maintenance-heartbeat')); interval=int(os.environ.get('ARTIFACT_MAINTENANCE_INTERVAL_SECONDS','300')); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime <= interval*3 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  web:
    build: {context: ../.., dockerfile: deploy/demo/web.Dockerfile}
    ports: ["${STAGING_HTTP_PORT:-8081}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging

volumes:
  staging-keycloak-data:
  staging-postgres-data:
  staging-redis-data:
  staging-minio-data:
