name: ai-auto-platform-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: demo-local-only
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
      - ../postgres/01-runtime-role.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - demo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-local-demo-only
    volumes:
      - demo-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  migrate:
    build:
      context: ../..
      dockerfile: deploy/demo/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://platform:demo-local-only@postgres:5432/platform
    command:
      - python
      - -c
      - >-
        from alembic import command;
        from alembic.config import Config;
        config = Config('/app/apps/api/alembic.ini');
        config.set_main_option('script_location', '/app/apps/api/migrations');
        config.set_main_option('prepend_sys_path', '/app/apps/api/src');
        config.set_main_option('sqlalchemy.url', 'postgresql+psycopg://platform:demo-local-only@postgres:5432/platform');
        command.upgrade(config, 'head') # alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: ../..
      dockerfile: deploy/demo/api.Dockerfile
    environment:
      APP_ENV: local
      APP_NAME: ai-auto-platform
      APP_VERSION: 0.1.0
      DATABASE_URL: postgresql+psycopg://platform:demo-local-only@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_ISSUER: http://127.0.0.1:8080/auth/realms/ai-platform
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/ai-platform
      OIDC_AUDIENCE: platform-api
      BFF_CLIENT_ID: platform-bff
      BFF_CLIENT_SECRET: bff-local-demo-only
      BFF_PUBLIC_ORIGIN: http://127.0.0.1:8080
      BFF_CALLBACK_URL: http://127.0.0.1:8080/auth/callback
      OSS_INTERNAL_ENDPOINT: http://minio:9000
      OSS_BUCKET: demo
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: ../..
      dockerfile: deploy/demo/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-demo-only
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: http://127.0.0.1:8080/auth
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/ai-platform-realm.json:/opt/keycloak/data/import/ai-platform-realm.json:ro
      - demo-keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

volumes:
  demo-keycloak-data:
  demo-postgres-data:
  demo-redis-data:
  demo-minio-data:
