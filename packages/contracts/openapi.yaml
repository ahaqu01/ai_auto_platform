openapi: 3.1.0
info:
  title: AI Auto Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveHealth
      tags: [health]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: {type: string, const: ok}
        service: {type: string}
        version: {type: string}
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        traceId: {type: string}

